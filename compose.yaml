name: mec-ss-2026-a2

services:
  db:
    build: ./postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ddss-database-assignment-2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ddss-database-assignment-2}
      POSTGRES_DB: ${POSTGRES_DB:-ddss-database-assignment-2}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-ddss-database-assignment-2}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ddss-database-assignment-2}
      DB_NAME: ${POSTGRES_DB:-ddss-database-assignment-2}
      FRONTEND_ORIGIN: http://localhost:5173
      SESSION_SECRET: ${SESSION_SECRET:-development-only-change-me}
    volumes:
      - ./backend/src:/usr/src/app/src
      - backend_node_modules:/usr/src/app/node_modules
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: /api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
